<!DOCTYPE html>
<html>
<head>
    <title>OTP Verification Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        input { padding: 8px; margin: 5px; width: 200px; }
        .result { margin: 10px 0; padding: 10px; background: #f5f5f5; border-radius: 3px; }
        .error { background: #ffe6e6; color: #d00; }
        .success { background: #e6ffe6; color: #0a0; }
    </style>
</head>
<body>
    <h1>🔍 OTP Verification Debug Test</h1>
    
    <div class="section">
        <h2>Step 1: Test Registration</h2>
        <input type="email" id="testEmail" placeholder="Test email" value="test@example.com">
        <input type="text" id="firstName" placeholder="First name" value="Test">
        <input type="text" id="lastName" placeholder="Last name" value="User">
        <button onclick="testRegistration()">Test Registration</button>
        <div id="registrationResult" class="result"></div>
    </div>

    <div class="section">
        <h2>Step 2: Test OTP Verification</h2>
        <input type="email" id="verifyEmail" placeholder="Email" value="test@example.com">
        <input type="text" id="otp" placeholder="OTP (6 digits)" value="123456">
        <button onclick="testOTPVerification()">Test OTP Verification</button>
        <div id="verificationResult" class="result"></div>
    </div>

    <div class="section">
        <h2>Step 3: Debug Information</h2>
        <button onclick="checkDatabaseStatus()">Check Database Collections</button>
        <button onclick="checkEnvironmentVariables()">Check Environment Variables</button>
        <div id="debugResult" class="result"></div>
    </div>

    <script>
        const API_BASE = '/api/auth';

        async function testRegistration() {
            const result = document.getElementById('registrationResult');
            result.innerHTML = 'Testing registration...';
            
            try {
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('testEmail').value,
                        firstName: document.getElementById('firstName').value,
                        lastName: document.getElementById('lastName').value,
                        role: 'customer'
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    result.className = 'result success';
                    result.innerHTML = `
                        <strong>✅ Registration Success!</strong><br>
                        Message: ${data.message}<br>
                        User ID: ${data.userId || 'N/A'}<br>
                        Check your email for OTP!
                    `;
                } else {
                    result.className = 'result error';
                    result.innerHTML = `
                        <strong>❌ Registration Failed!</strong><br>
                        Error: ${data.error}<br>
                        Status: ${response.status}
                    `;
                }
            } catch (error) {
                result.className = 'result error';
                result.innerHTML = `<strong>❌ Network Error:</strong><br>${error.message}`;
            }
        }

        async function testOTPVerification() {
            const result = document.getElementById('verificationResult');
            result.innerHTML = 'Testing OTP verification...';
            
            try {
                const response = await fetch(`${API_BASE}/verify-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('verifyEmail').value,
                        otp: document.getElementById('otp').value
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    result.className = 'result success';
                    result.innerHTML = `
                        <strong>✅ OTP Verification Success!</strong><br>
                        Access Token: ${data.accessToken ? 'Generated' : 'N/A'}<br>
                        User: ${data.user ? data.user.email : 'N/A'}<br>
                        Role: ${data.user ? data.user.role : 'N/A'}
                    `;
                } else {
                    result.className = 'result error';
                    result.innerHTML = `
                        <strong>❌ OTP Verification Failed!</strong><br>
                        Error: ${data.error}<br>
                        Status: ${response.status}
                    `;
                }
            } catch (error) {
                result.className = 'result error';
                result.innerHTML = `<strong>❌ Network Error:</strong><br>${error.message}`;
            }
        }

        async function checkDatabaseStatus() {
            const result = document.getElementById('debugResult');
            result.innerHTML = 'Checking database status...';
            
            try {
                // This will test if the OTPStorage collection exists
                const response = await fetch(`${API_BASE}/verify-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'nonexistent@test.com',
                        otp: '123456'
                    })
                });

                const data = await response.json();
                
                if (data.error && data.error.includes('collection')) {
                    result.className = 'result error';
                    result.innerHTML = `
                        <strong>❌ Database Collection Issue!</strong><br>
                        Error: ${data.error}<br>
                        Solution: Create OTPStorage collection in Appwrite Console
                    `;
                } else {
                    result.className = 'result success';
                    result.innerHTML = `
                        <strong>✅ Database Collections Working!</strong><br>
                        Error: ${data.error || 'No error - collections exist'}
                    `;
                }
            } catch (error) {
                result.className = 'result error';
                result.innerHTML = `<strong>❌ Database Check Failed:</strong><br>${error.message}`;
            }
        }

        async function checkEnvironmentVariables() {
            const result = document.getElementById('debugResult');
            result.innerHTML = 'Checking environment variables...';
            
            try {
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'envtest@example.com',
                        firstName: 'Env',
                        lastName: 'Test',
                        role: 'customer'
                    })
                });

                const data = await response.json();
                
                if (data.error && data.error.includes('JWT_SECRET')) {
                    result.className = 'result error';
                    result.innerHTML = `
                        <strong>❌ JWT_SECRET Missing!</strong><br>
                        Error: ${data.error}<br>
                        Solution: Set JWT_SECRET in Cloudflare Pages environment variables
                    `;
                } else {
                    result.className = 'result success';
                    result.innerHTML = `
                        <strong>✅ Environment Variables Working!</strong><br>
                        JWT_SECRET appears to be configured
                    `;
                }
            } catch (error) {
                result.className = 'result error';
                result.innerHTML = `<strong>❌ Environment Check Failed:</strong><br>${error.message}`;
            }
        }
    </script>
</body>
</html>
